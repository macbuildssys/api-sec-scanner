name: api-security-scan
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Scan
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          API_SPEC_URL: ${{ vars.API_SPEC_URL }}
          API_SCANNER_TOKEN: ${{ secrets.API_SCANNER_TOKEN }}
        run: >
          api-sec-scanner scan "$API_BASE_URL"
          --spec "$API_SPEC_URL"
          --profile asset-profile.yaml
          -f sarif -o results.sarif
          --fail-on high --yes
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
